<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blues and Bebop Practice Grid</title>
<style>
:root{--ink:#182536;--muted:#687486;--green:#398c71;--line:#d9e1e9;--paper:#f4f6f8;--panel:#f1f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.45 Arial,sans-serif;color:var(--ink)}.sheet{max-width:1240px;margin:24px auto;padding:32px 36px;background:#fff;border-radius:16px;box-shadow:0 12px 40px #23354a14}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--green);font-size:12px;font-weight:bold}.topline{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}h1{font-size:32px;margin:6px 0 3px}.subtitle{color:var(--muted)}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{font-weight:bold}.controls select,.controls button{font:inherit;border:1px solid #bdc8d4;border-radius:8px;padding:9px 12px;background:white;color:var(--ink)}.controls button{cursor:pointer;background:#f7f9fb}.controls button:hover{border-color:var(--green)}.tabs{display:flex;gap:8px;margin:20px 0 0;border-bottom:1px solid var(--line)}.tab{font:inherit;padding:10px 16px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:#f7f9fb;color:var(--muted);cursor:pointer}.tab[aria-selected='true']{background:#fff;color:var(--ink);font-weight:bold;border-top:3px solid var(--green);padding-top:8px}.instruction{margin:18px 0 12px;padding:12px 15px;border-left:4px solid var(--green);background:var(--panel);color:#435469}.keybox{margin:0 0 12px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;color:var(--muted);display:flex;gap:26px;flex-wrap:wrap}.keybox b{color:var(--ink)}.chart-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}svg{display:block;width:100%;min-width:980px;height:auto}.gridline{stroke:#e9edf1;stroke-width:1}.barline{stroke:#d5dde5;stroke-width:1}.bar-num{font-size:11px;fill:#788392;font-weight:bold;letter-spacing:.08em}.chord{font-size:16px;fill:var(--ink);font-weight:bold}.degree{font-size:13px;fill:#263548;text-anchor:middle}.note{font-size:10px;fill:#687486;text-anchor:middle}.circ{fill:none;stroke:var(--green);stroke-width:2.5}.guide-third{fill:var(--green);stroke:var(--green);stroke-width:2.5}.guide-seventh{fill:var(--ink);stroke:var(--ink);stroke-width:2.5}.guide-third-label,.guide-seventh-label{fill:#fff!important;font-weight:bold}.legend{margin:12px 2px 0;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}.sample{display:inline-block;width:28px;height:22px;border:2px solid var(--green);border-radius:50%;vertical-align:middle}.third-sample{background:var(--green)}.seventh-sample{background:var(--ink)}.progression{margin-top:14px;font-size:13px;color:var(--muted)}.progression b{color:var(--ink)}.caption{font-size:12px;color:var(--muted);margin-top:10px}.foot{font-size:11px;color:#7d8794;margin-top:15px}
@media(max-width:700px){.sheet{margin:0;padding:22px 16px;border-radius:0}h1{font-size:26px}.controls{width:100%}}
@media print{body{background:white}.sheet{max-width:none;margin:0;padding:7mm;box-shadow:none;border-radius:0}.controls,.tabs{display:none}.chart-wrap{overflow:visible;padding:4px;border:0}svg{min-width:0;width:100%}.instruction{margin:8px 0}.keybox{margin-bottom:6px}.caption{margin-top:6px}@page{size:landscape;margin:7mm}}
</style></head><body><main class="sheet">
<div class="topline"><div><div class="eyebrow">Trumpet reads and plays the displayed notes</div><h1 id="title">12-Bar C Minor Blues</h1><div class="subtitle">Choose a home key, major or minor mode, and chord progression.</div></div><div class="controls"><label for="homeKey">Home key</label><select id="homeKey" aria-label="Choose home key"></select><label for="mode">Mode</label><select id="mode" aria-label="Choose major or minor"><option value="minor">Minor</option><option value="major">Major</option></select><label for="progressionType">Progression</label><select id="progressionType" aria-label="Choose chord progression"><option value="blues">12-bar blues</option><option value="251">ii–V–I (12 bars)</option></select><button id="printBtn" type="button">Print chart</button></div></div>
<div class="tabs" role="tablist" aria-label="Chart type"><button class="tab" id="bluesTab" role="tab" aria-selected="true" type="button">Blues scale</button><button class="tab" id="bebopTab" role="tab" aria-selected="false" type="button">Bebop scale</button><button class="tab" id="autumnTab" role="tab" aria-selected="false" type="button">Autumn Leaves</button></div>
<div class="instruction" id="instruction"></div><div class="keybox"><span id="scaleLine"></span><span id="extraLine"></span></div>
<div class="chart-wrap"><svg id="chart" viewBox="0 0 1160 515" role="img" aria-label="Twelve-bar scale degree grid"></svg></div>
<div class="legend"><span class="sample third-sample"></span> Chord 3rd &nbsp;&nbsp; <span class="sample seventh-sample"></span> Chord 7th &nbsp;&nbsp; <span class="sample"></span> Other chord tone</div><div class="progression" id="progression"></div><div class="caption" id="caption"></div><div class="foot" id="foot"></div>
</main><script>
const keyNames=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const keyPitch={'C':0,'D♭':1,'D':2,'E♭':3,'E':4,'F':5,'F♯':6,'G':7,'A♭':8,'A':9,'B♭':10,'B':11};
const letters=['C','D','E','F','G','A','B'],naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const flatChromatic=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const minorIntervals=[['1',0,0],['2',2,1],['♭3',3,2],['4',5,3],['♭5',6,4],['5',7,4],['♭6',8,5],['♭7',10,6],['7',11,6]];
const majorIntervals=[['1',0,0],['2',2,1],['♭3',3,2],['3',4,2],['4',5,3],['♭5',6,4],['5',7,4],['6',9,5],['♭7',10,6],['7',11,6]];
const bebopScales={
 dorian:{name:'Dorian bebop',degrees:[['1',0,0],['2',2,1],['♭3',3,2],['3',4,2],['4',5,3],['5',7,4],['6',9,5],['♭7',10,6]]},
 dominant:{name:'Dominant bebop',degrees:[['1',0,0],['2',2,1],['3',4,2],['4',5,3],['5',7,4],['6',9,5],['♭7',10,6],['7',11,6]]},
 major:{name:'Major bebop',degrees:[['1',0,0],['2',2,1],['3',4,2],['4',5,3],['5',7,4],['♭6',8,5],['6',9,5],['7',11,6]]},
 halfdim:{name:'Half-diminished bebop',degrees:[['1',0,0],['♭2',1,1],['♭3',3,2],['4',5,3],['♭5',6,4],['5',7,4],['♭6',8,5],['♭7',10,6]]}
};
const svg=document.getElementById('chart'),NS='http://www.w3.org/2000/svg';let currentKey='C',currentMode='minor',currentProgression='blues',currentTab='blues';
keyNames.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k+' minor';document.getElementById('homeKey').appendChild(o)});
function homeData(){
 const tonic=keyPitch[currentKey],letterStart=letters.indexOf(currentKey[0]),intervals=currentMode==='minor'?minorIntervals:majorIntervals;
 const noteAt=(semitones,letterSteps,label)=>{let target=(tonic+semitones)%12;if(label==='♭5')return flatChromatic[target];let letter=letters[(letterStart+letterSteps)%7],diff=(target-naturalPitch[letter]+12)%12;if(diff>6)diff-=12;let acc=diff===-1?'♭':diff===1?'♯':diff===0?'':(diff<0?'♭'.repeat(-diff):'♯'.repeat(diff));return letter+acc};
 const notes=Object.fromEntries(intervals.map(([d,s,l])=>[d,noteAt(s,l,d)]));
 return {tonic,intervals,notes};
}
function makeModel(){
 const {tonic,intervals,notes}=homeData(),minor=currentMode==='minor',is251=currentProgression==='251';let chords={},pattern;
 const def=(id,rootDegree,suffix,quality,grid,third,seventh)=>{const rootSemitones={'1':0,'2':2,'4':5,'5':7}[rootDegree];chords[id]={id,name:notes[rootDegree]+suffix,rootName:notes[rootDegree],rootPc:(tonic+rootSemitones)%12,quality,grid,third,seventh}};
 if(is251&&minor){def('iiø','2','m7♭5','halfdim',['2','4','♭6','1'],'4','1');def('V','5','7','dominant',['5','7','2','4'],'7','4');def('i','1','m7','minor',['1','♭3','5','♭7'],'♭3','♭7');pattern=['iiø','V','i'];}
 else if(is251){def('ii','2','m7','minor',['2','4','6','1'],'4','1');def('V','5','7','dominant',['5','7','2','4'],'7','4');def('I','1','maj7','major',['1','3','5','7'],'3','7');pattern=['ii','V','I'];}
 else if(minor){def('i','1','m7','minor',['1','♭3','5','♭7'],'♭3','♭7');def('iv','4','m7','minor',['4','♭6','1','♭3'],'♭6','♭3');def('V','5','7','dominant',['5','7','2','4'],'7','4');pattern=['i','i','i','i','iv','iv','i','i','V','iv','i','V'];}
 else {def('I','1','7','dominant',['1','3','5','♭7'],'3','♭7');def('IV','4','7','dominant',['4','6','1','♭3'],'6','♭3');def('V','5','7','dominant',['5','7','2','4'],'7','4');pattern=['I','I','I','I','IV','IV','I','I','V','IV','I','V'];}
 const bars=is251?Array.from({length:12},(_,i)=>pattern[i%3]):pattern;
 const scaleDegrees=minor?['1','♭3','4','♭5','5','♭7']:['1','2','♭3','3','5','6'];
 return {tonic,intervals,notes,chords,bars,is251,minor,scaleDegrees};
}
function drawGrid(columns,degreeRows,relative){
 const rows=degreeRows.length,top=105,row=40,x0=80,perRow=columns.length>12?8:12,col=columns.length>12?135:89,block=top+(rows-1)*row+70,groups=Math.ceil(columns.length/perRow);
 svg.setAttribute('viewBox','0 0 1160 '+Math.max(515,groups*block));svg.style.width='100%';svg.style.minWidth='980px';svg.replaceChildren();
 function add(tag,attrs,text){let e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e}
 for(let g=0;g<groups;g++){let offset=g*block,base=top+offset,bottom=base+(rows-1)*row,start=g*perRow,count=Math.min(perRow,columns.length-start),width=columns.length>12?x0+(count-.5)*col+45:1145;for(let i=0;i<=count;i++){let x=x0+i*col-col/2;add('line',{x1:x,y1:offset+68,x2:x,y2:bottom+31,class:'barline'})}for(let r=0;r<=rows;r++){let y=base+r*row-19;add('line',{x1:35,y1:y,x2:width,y2:y,class:'gridline'})}columns.slice(start,start+count).forEach((c,k)=>{let i=start+k,x=x0+k*col;add('text',{x,y:offset+25,class:'bar-num','text-anchor':'middle'},c.label||'BAR '+(i+1));add('text',{x,y:offset+51,class:'chord','text-anchor':'middle'},c.chord.name);degreeRows.forEach(([degree,note],j)=>{let entry=relative?c.scale[j]:null,displayDegree=relative?entry[0]:degree,shownNote=relative?entry[1]:note,y=base+(rows-1-j)*row,group=document.createElementNS(NS,'g'),pc=relative?(Array.isArray(entry)?(entry[2]??null):entry):null,isChord=relative?(c.tones.includes(pc)||c.tones.includes(displayDegree)):c.chord.grid.includes(displayDegree),isThird=relative?(pc===c.chord.third||displayDegree===c.chord.third):displayDegree===c.chord.third,isSeventh=relative?(pc===c.chord.seventh||displayDegree===c.chord.seventh):displayDegree===c.chord.seventh;if(isChord){let ell=document.createElementNS(NS,'ellipse');ell.setAttribute('cx',x);ell.setAttribute('cy',y-2);ell.setAttribute('rx','31');ell.setAttribute('ry','17');ell.setAttribute('class',isThird?'guide-third':isSeventh?'guide-seventh':'circ');group.appendChild(ell)}let t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y-3);t.setAttribute('class','degree'+(isThird?' guide-third-label':isSeventh?' guide-seventh-label':''));t.textContent=displayDegree;group.appendChild(t);let n=document.createElementNS(NS,'text');n.setAttribute('x',x);n.setAttribute('y',y+10);n.setAttribute('class','note'+(isThird?' guide-third-label':isSeventh?' guide-seventh-label':''));n.textContent=shownNote||'';group.appendChild(n)})})}
}
function renderBlues(){
 const m=makeModel(),names=m.bars.map(k=>m.chords[k].name),modeName=m.minor?'Minor':'Major',progName=m.is251?'ii–V–I':'Blues';
 document.getElementById('title').textContent='12-Bar '+currentKey+' '+modeName+' '+progName;
 document.getElementById('instruction').textContent='Read each column from bottom to top. The degree and note name are relative to the home key. Green circles mark chord 3rds; navy circles mark chord 7ths; other chord tones are outlined.';
 document.getElementById('scaleLine').innerHTML='<b>'+currentKey+' '+currentMode+(m.is251?' home-key degree grid':' blues scale')+':</b> '+m.scaleDegrees.map(d=>m.notes[d]).join(' · ');
 document.getElementById('extraLine').innerHTML=m.is251?'<b>ii–V–I cycle repeats four times across 12 bars.</b>':'<b>12-bar blues form.</b>';
 document.getElementById('progression').innerHTML='<b>12-bar form:</b> '+names.join(' · ');
 document.getElementById('caption').textContent=m.is251?(m.minor?'Minor ii–V–i uses iiø7, V7, and i7.':'Major ii–V–I uses ii7, V7, and Imaj7.')+' Guide tones follow each chord’s own 3rd and 7th.':'The chord 3rd is green and the chord 7th is navy. The other chord tones are outlined.';
 document.getElementById('foot').textContent=m.is251?'The ii–V–I cycle is repeated four times to fill 12 bars. The grid degrees are measured from the selected home key.':'Standard 12-bar '+currentMode+' blues progression. The grid degrees are measured from the selected home key.';
 document.getElementById('chart').setAttribute('aria-label','Twelve-bar '+currentMode+' '+progName+' home-key scale degree grid with chord guide tones');
 const cols=m.bars.map(id=>({chord:m.chords[id]}));drawGrid(cols,m.intervals.map(([d])=>[d,m.notes[d]]),false);
}
function renderBebop(){
 const m=makeModel(),names=m.bars.map(k=>m.chords[k].name),modeName=m.minor?'Minor':'Major';
 const scaleFor=q=>q==='minor'?bebopScales.dorian:q==='dominant'?bebopScales.dominant:q==='major'?bebopScales.major:bebopScales.halfdim;
 const noteFromRoot=(root,semi,letterStep)=>{const rootLetter=root.rootName[0],letter=letters[(letters.indexOf(rootLetter)+letterStep)%7],target=(root.rootPc+semi)%12;let diff=(target-naturalPitch[letter]+12)%12;if(diff>6)diff-=12;const accidental=diff===-1?'♭':diff===1?'♯':diff===0?'':(diff<0?'♭'.repeat(-diff):'♯'.repeat(diff));return letter+accidental};
 const cols=m.bars.map(id=>{const chord=m.chords[id],scale=scaleFor(chord.quality).degrees,notes=scale.map(([d,s,l])=>[d,noteFromRoot(chord,s,l)]);return {chord,scale:notes,tones:chord.quality==='minor'?['1','♭3','5','♭7']:chord.quality==='dominant'?['1','3','5','♭7']:chord.quality==='major'?['1','3','5','7']:['1','♭3','♭5','♭7']}});
 const scaleTypes=[...new Set(m.bars.map(id=>scaleFor(m.chords[id].quality).name))];
 document.getElementById('title').textContent='Bebop · 12-Bar '+currentKey+' '+modeName+' '+(m.is251?'ii–V–I':'Blues');
 document.getElementById('instruction').textContent='Each column uses scale degrees relative to the chord above it. Green circles mark that chord’s 3rd; navy circles mark its 7th; other chord tones are outlined.';
 document.getElementById('scaleLine').innerHTML='<b>Bebop scales used:</b> '+scaleTypes.join(' · ');
 document.getElementById('extraLine').innerHTML=m.is251?'<b>ii–V–I cycle repeats four times across 12 bars.</b>':'<b>Scale choice changes with chord quality.</b>';
 document.getElementById('progression').innerHTML='<b>12-bar form:</b> '+names.join(' · ');
 document.getElementById('caption').textContent=m.is251?'Major ii–V–I uses Dorian bebop, dominant bebop, and major bebop. Minor ii–V–i uses half-diminished bebop, dominant bebop, and Dorian bebop.':'Minor 7th chords use Dorian bebop; dominant 7th chords use dominant bebop. Major blues chords are all dominant 7th chords, so use dominant bebop through the form.';
 document.getElementById('foot').textContent='Bebop scales add a chromatic passing tone. In this grid, degrees reset to 1 at each chord root; use the green 3rd and navy 7th as guide tones.';
 drawGrid(cols,cols[0].scale.map(([d])=>[d,'']),true);
}
function renderAutumn(){
 const tonic=keyPitch[currentKey],minor=currentMode==='minor',homeLetter=letters.indexOf(currentKey[0]),minorTonic=minor?tonic:(tonic+9)%12,minorLetter=minor?homeLetter:(homeLetter+5)%7,labels=['1','♭2','2','♭3','3','4','♭5','5','♭6','6','♭7','7'],letterSteps=[0,1,1,2,2,3,4,4,5,5,6,6];
 const noteAt=(semi,step)=>{const target=(tonic+semi+12)%12,letter=letters[(homeLetter+step+7)%7];let diff=(target-naturalPitch[letter]+12)%12;if(diff>6)diff-=12;return letter+(diff===-1?'♭':diff===1?'♯':diff===0?'':diff<0?'♭'.repeat(-diff):'♯'.repeat(diff))};
 const harmonyNote=(semi,step)=>{const target=(minorTonic+semi+12)%12,letter=letters[(minorLetter+step+7)%7];let diff=(target-naturalPitch[letter]+12)%12;if(diff>6)diff-=12;return letter+(diff===-1?'♭':diff===1?'♯':diff===0?'':diff<0?'♭'.repeat(-diff):'♯'.repeat(diff))};
 const intervals={minor:[[0,0],[3,2],[7,4],[10,6]],dominant:[[0,0],[4,2],[7,4],[10,6]],major:[[0,0],[4,2],[7,4],[11,6]],halfdim:[[0,0],[3,2],[6,4],[10,6]],dominant9:[[0,0],[4,2],[7,4],[10,6],[1,1]]};
 const rootSpec={iv:[5,3],bVII:[10,6],bIII:[3,2],bVI:[8,5],iiø:[2,1],V:[7,4],i:[0,0]};
 const makeChord=(degree,kind,extra='')=>{let [semi,step]=rootSpec[degree],rootPc=(minorTonic+semi)%12,rootName=harmonyNote(semi,step),defs=intervals[kind],tones=defs.map(([s,l])=>{let target=(rootPc+s)%12,letter=letters[(letters.indexOf(rootName[0])+l)%7],diff=(target-naturalPitch[letter]+12)%12;if(diff>6)diff-=12;return {pc:target,note:letter+(diff===-1?'♭':diff===1?'♯':diff===0?'':diff<0?'♭'.repeat(-diff):'♯'.repeat(diff))}});return {name:rootName+(kind==='minor'?'m7':kind==='dominant'?'7':kind==='dominant9'?'7♭9':kind==='major'?'maj7':'m7♭5')+extra,rootPc,tones,third:tones[1].pc,seventh:tones[3].pc}};
 const custom=(offset,kind)=>{const rootPc=(minorTonic+offset+12)%12,rootName=flatChromatic[rootPc],defs=intervals[kind],tones=defs.map(([s,l])=>{let target=(rootPc+s)%12,letter=letters[(letters.indexOf(rootName[0])+l)%7],diff=(target-naturalPitch[letter]+12)%12;if(diff>6)diff-=12;return {pc:target,note:letter+(diff===-1?'♭':diff===1?'♯':diff===0?'':diff<0?'♭'.repeat(-diff):'♯'.repeat(diff))}});return {name:rootName+(kind==='minor'?'m7':'7'),rootPc,tones,third:tones[1].pc,seventh:tones[3].pc}};
 const c=(d,q,x)=>makeChord(d,q,x),a=[c('iv','minor'),c('bVII','dominant'),c('bIII','major'),c('bVI','major'),c('iiø','halfdim'),c('V','dominant'),c('i','minor'),c('i','minor')];
 const b=[c('iiø','halfdim'),c('V','dominant9'),c('i','minor'),c('i','minor'),c('iv','minor'),c('bVII','dominant'),c('bIII','major'),c('bVI','major')];
 const end=[c('iiø','halfdim'),c('V','dominant9'),c('i','minor'),custom(11,'dominant'),custom(10,'minor'),custom(9,'dominant'),c('bVI','major'),c('V','dominant9'),c('i','minor')];
 const chords=[...a,...a,...b,...end],sections=chords.map((_,i)=>i<8?'A1':i<16?'A2':i<24?'B':'C'),cols=chords.map((chord,i)=>({chord,label:sections[i]+' · '+(i+1),scale:labels.map((d,n)=>[d,noteAt(n,letterSteps[n]),(tonic+n)%12]),tones:chord.tones.map(t=>t.pc)}));
 const keyLabel=minor?currentKey+' minor':'relative minor of '+currentKey+' major';
 document.getElementById('title').textContent='Autumn Leaves · '+(minor?currentKey+' minor':currentKey+' major');
 document.getElementById('instruction').textContent='Read each chord column from bottom to top and move left to right, row by row. Circles mark chord tones; green is the 3rd and navy is the 7th. This is a first-pass transcription for checking against your Real Book.';
 document.getElementById('scaleLine').innerHTML='<b>Transposition:</b> '+keyLabel+' · trumpet plays the displayed concert-pitch notes.';
 document.getElementById('extraLine').innerHTML='<b>Form:</b> A1 · A2 · B · C; each column is one chord symbol, including the later chromatic changes.';
 document.getElementById('progression').innerHTML='<b>Real Book first pass:</b> '+chords.map(ch=>ch.name).join(' · ');
 document.getElementById('caption').textContent='Other chord tones have outline circles. The green and navy fills identify each chord’s 3rd and 7th.';
 document.getElementById('foot').textContent='Transposed from the supplied Real Book image, read as B minor / E7 / A major / D major / G♯ half-diminished / C♯7 / F♯ minor, with later C♯7♭9, F7, E minor, and E♭7 changes. Please check the later symbols and bar placement.';
 document.getElementById('chart').setAttribute('aria-label','Autumn Leaves chord tones and guide tones transposed to '+keyLabel);
 drawGrid(cols,labels.map((d,i)=>[d,noteAt(i,letterSteps[i])]),true);
}
function render(){if(currentTab==='blues')renderBlues();else if(currentTab==='bebop')renderBebop();else renderAutumn()}
const homeSelect=document.getElementById('homeKey'),modeSelect=document.getElementById('mode'),progressionSelect=document.getElementById('progressionType');homeSelect.value=currentKey;modeSelect.value=currentMode;
homeSelect.addEventListener('change',e=>{currentKey=e.target.value;render()});modeSelect.addEventListener('change',e=>{currentMode=e.target.value;Array.from(homeSelect.options).forEach(o=>o.textContent=o.value+' '+currentMode);render()});progressionSelect.addEventListener('change',e=>{currentProgression=e.target.value;render()});
['bluesTab','bebopTab','autumnTab'].forEach((id,index)=>document.getElementById(id).addEventListener('click',()=>{currentTab=['blues','bebop','autumn'][index];['bluesTab','bebopTab','autumnTab'].forEach(tab=>document.getElementById(tab).setAttribute('aria-selected',tab===id?'true':'false'));render()}));document.getElementById('printBtn').addEventListener('click',()=>window.print());render();
</script></body></html>
